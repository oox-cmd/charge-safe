# 云端正式演示库配置
# 用途：正式部署、课程展示、答辩演示、录制系统视频使用
# 注意：此配置优先从环境变量读取，不要在此文件中写入真实密码

server:
  port: ${SERVER_PORT:8081}
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:mysql://${CHARGE_SAFE_DB_HOST:127.0.0.1}:${CHARGE_SAFE_DB_PORT:3306}/${CHARGE_SAFE_DB_NAME:charge_safe}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${CHARGE_SAFE_DB_USERNAME:charge_safe_app}
    password: ${CHARGE_SAFE_DB_PASSWORD}
  flyway:
    enabled: true

logging:
  level:
    com.chargesafe: info
